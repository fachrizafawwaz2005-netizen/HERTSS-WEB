<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose how you'd like to continue — HERTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2F5EA7;      /* blue */
  --brand-deep:#234A86; /* hover */
  --ink:#17212F;        /* text: instrument navy */
  --bg:#F7F8F8;
  --white:#FFFFFF;
  --navy:#17212F;

  /* Comfortable, user-centred sizing */
  --fs-heading:clamp(1.375rem,1.2rem + .7vw,1.625rem);  /* 22–26px */
  --fs-sub:1rem;                                        /* 16px */
  --fs-btn:1.0625rem;                                   /* 17px */
  --btn-h:clamp(3.25rem,3rem + .6vw,3.75rem);           /* 52–60px: still above the 44–48px touch minimum */
  --form-w:clamp(20rem,32vw,30rem);                    /* 320–480px: short, scannable line length */
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:1.0625rem;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:3px;border-radius:12px}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh;min-height:100dvh}

/* Left: illustration */
.visual{position:relative;overflow:hidden;background:var(--navy)}
.visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
/* duotone: recolours the (magenta) photo into the brand blues without replacing the image */
.visual::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#2F5EA7 0%,#6BBBCE 100%);mix-blend-mode:color;pointer-events:none}

/* Right: role selection */
.panel{display:flex;align-items:center;justify-content:center;padding:clamp(2rem,6vh,4rem) clamp(1.5rem,5vw,4rem)}
.panel-inner{width:100%;max-width:var(--form-w);min-width:0;margin-top:-4vh}   /* optical centre sits slightly above the true centre */
.brand{display:inline-flex;align-items:center;gap:1rem;text-decoration:none;margin-bottom:clamp(2rem,5vh,3rem);border-radius:12px}
.brand img{height:clamp(48px,4vw,58px);width:auto}
.brand b{display:block;font-size:clamp(1.125rem,1.05rem + .3vw,1.25rem);line-height:1.1;font-weight:700;letter-spacing:.01em}
.brand span{display:block;font-size:.9375rem;line-height:1.3}
h1{font-size:var(--fs-heading);line-height:1.25;font-weight:700;letter-spacing:-.005em;text-wrap:balance}
.sub{font-size:var(--fs-sub);margin-top:.75rem}
.roles{display:grid;gap:1rem;margin-top:1.75rem}
.role{display:flex;align-items:center;justify-content:center;min-height:var(--btn-h);padding:.75rem 1.5rem;border-radius:12px;background:var(--brand);background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 62%);color:var(--white);text-decoration:none;font-size:var(--fs-btn);font-weight:700;letter-spacing:.01em;box-shadow:0 1px 2px rgba(23,33,47,.25),0 8px 18px -8px rgba(35,74,134,.6);transition:background .15s,transform .1s,box-shadow .15s}
.role:hover{background:var(--brand-deep);background-image:none;box-shadow:0 1px 2px rgba(23,33,47,.25),0 10px 20px -8px rgba(35,74,134,.7)}
.role:active{transform:translateY(1px);box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* Large desktop: keep proportions, don't let the form float in empty space */
@media (min-width:1600px){
  .split{grid-template-columns:minmax(0,55fr) minmax(0,45fr)}
}
/* Tablet landscape / small laptop: give the form more room than the image */
@media (max-width:1100px){
  .split{grid-template-columns:minmax(0,40fr) minmax(0,60fr)}
  .panel-inner{max-width:26rem}
}
/* Tablet portrait & mobile: image becomes a banner, form takes the screen */
@media (max-width:820px){
  .split{grid-template-columns:1fr;grid-template-rows:clamp(160px,26vh,260px) auto}
  .visual img{object-position:center 28%}
  .panel{align-items:flex-start;padding:2rem 1.5rem 3rem}
  .panel-inner{margin-top:0;max-width:30rem;margin-inline:auto}
}
@media (max-width:420px){
  .panel{padding:1.75rem 1.25rem 2.5rem}
  .role{min-height:3.25rem}
}
/* Short screens (landscape phones, small laptops): tighten vertical rhythm so nothing is clipped */
@media (max-height:620px){
  .split{grid-template-rows:none}
  .panel{padding-block:1.25rem;align-items:flex-start}
  .panel-inner{margin-top:0}
  .brand{margin-bottom:1.25rem}
  .roles{margin-top:1.25rem;gap:.75rem}
}
@media (max-height:620px) and (max-width:820px){
  .split{grid-template-columns:34fr 66fr;grid-template-rows:none}
  .visual{display:block}
}
@media (prefers-reduced-motion:reduce){.role{transition:none}}
</style>
  <link rel="stylesheet" href="assets/mobile-responsive.css">
</head>
<body>
<div class="split">

  <div class="visual" aria-hidden="true">
    <img src="assets/lungs.jpg" width="797" height="1024" alt="">
  </div>

  <main class="panel">
    <div class="panel-inner">
      <a class="brand" href="index.html" aria-label="HERTS Cardiac Monitor — back to Home">
        <img src="assets/herts-logo.png" width="132" height="78" alt="">
        <div><b>HERTS</b><span>CARDIAC MONITOR</span></div>
      </a>

      <h1>Choose how you'd like to continue</h1>
      <p class="sub" id="continue-as">Continue as</p>

      <!-- Role selection: navigates to the sign-in pages. No authentication happens on this page. -->
      <nav class="roles" aria-labelledby="continue-as">
        <a class="role" href="patient-signin.html">Patient</a>
        <a class="role" href="doctor-signin.html">Doctor</a>
      </nav>
    </div>
  </main>

</div>
</body>
</html>
